# Same SPA-fallback behavior as vercel.json's own rewrite rule — every path that isn't a real
# static file falls back to index.html so client-side routing (react-router) handles it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
